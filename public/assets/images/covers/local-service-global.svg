  <text x="74" y="674" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#f2ede3" opacity=".58">移动洗车、高压清洗、上门除虫——这些“蓝领生意”在海外是典型的中产收入路径，但前提是你能持续找到愿意付 200 美元的客户。</text>

  <text x="72" y="104" font-family="Georgia, serif" font-size="15" letter-spacing="3.4" fill="#232a33" opacity=".62">LOW-COST STARTUP<tspan dx="16" font-family="'PingFang SC','Microsoft YaHei',sans-serif" letter-spacing="2">小成本创业</tspan></text>
  <text x="72" y="500" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#232a33">一人公司：一个人能撑起</text><text x="72" y="562" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#232a33">多大的生意</text>
  <text x="74" y="650" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#232a33" opacity=".58">一人公司不是“没有员工的小公司”，而是一种以个人能力为核心、用工具与外部协作替代组织的经营方式。它的天花板不是能力，而是结构。</text>

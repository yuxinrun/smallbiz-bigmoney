  <text x="72" y="104" font-family="Georgia, serif" font-size="15" letter-spacing="3.4" fill="#f2ede3" opacity=".62">CASE STUDY<tspan dx="16" font-family="'PingFang SC','Microsoft YaHei',sans-serif" letter-spacing="2">赚钱案例</tspan></text>
  <text x="72" y="462" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#f2ede3">小众垂类电商：不追爆款</text><text x="72" y="524" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#f2ede3">，做“少数人非常在意”</text><text x="72" y="586" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#f2ede3">的生意</text>
  <text x="74" y="674" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#f2ede3" opacity=".58">垂类电商的活法不是比价，而是让一小群人觉得“只有你懂我”。代价是更慢的增长、更高的内容成本与更难的库存管理。</text>

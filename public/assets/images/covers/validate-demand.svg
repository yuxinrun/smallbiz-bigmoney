  <text x="72" y="104" font-family="Georgia, serif" font-size="15" letter-spacing="3.4" fill="#f2ede3" opacity=".62">METHODS<tspan dx="16" font-family="'PingFang SC','Microsoft YaHei',sans-serif" letter-spacing="2">经营方法论</tspan></text>
  <text x="72" y="500" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#f2ede3">如何发现真实需求：别问</text><text x="72" y="562" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#f2ede3">“你会买吗”</text>
  <text x="74" y="650" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#f2ede3" opacity=".58">最危险的市场调研，是让用户对未来做承诺。真实需求不在问卷里，而在他们已经在为什么付钱、为什么抱怨、为什么反复将就。</text>

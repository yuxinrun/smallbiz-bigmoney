  <text x="72" y="104" font-family="Georgia, serif" font-size="15" letter-spacing="3.4" fill="#22402f" opacity=".62">CASH FLOW<tspan dx="16" font-family="'PingFang SC','Microsoft YaHei',sans-serif" letter-spacing="2">现金流经营</tspan></text>
  <text x="72" y="500" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#22402f">现金流为什么比账面利润</text><text x="72" y="562" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#22402f">重要</text>
  <text x="74" y="650" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#22402f" opacity=".58">利润是会计算出来的观点，现金是银行账户里的事实。小生意死于现金断裂，而不是死于利润为负。</text>
  <path d="M72 668h420" stroke="#22402f" stroke-width="1" opacity=".3"/>
  <text x="72" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" letter-spacing="2" fill="#22402f" opacity=".65">小生意，赚大钱</text>
  <text x="1128" y="700" text-anchor="end" font-family="Georgia, serif" font-size="13" letter-spacing="2.4" fill="#22402f" opacity=".5">SMALL BUSINESS BIG MONEY</text>

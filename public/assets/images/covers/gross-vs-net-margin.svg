  <text x="72" y="500" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#f2ede3">毛利率与净利率：两个数</text><text x="72" y="562" font-family="'Noto Serif SC','Songti SC',serif" font-size="56" font-weight="600" letter-spacing="1" fill="#f2ede3">字，两种命运</text>
  <text x="74" y="650" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#f2ede3" opacity=".58">毛利率说明你的产品值不值钱，净利率说明你的生意能不能活。把两者混为一谈，是新手最常犯的财务错误。</text>
